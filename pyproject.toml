[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-tract"
version = "0.1.0.dev0"
description = "Streamline tractography on FOD fields, batched on the JAX device"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "jax>=0.4.30",
    "dmipy-sim",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]"]
torch = ["torch>=2.2"]                 # the torch kernel, for hosts that run PyTorch only
# dipy is the test oracle, never a runtime import; dipy 1.12 needs trx-python, which has no Python 3.10 wheel
test = [
    "pytest>=7", "scipy>=1.10", "nibabel>=5.0", "dmipy-fit", "huggingface_hub", "torch>=2.2",
    "dipy>=1.12; python_version >= '3.11'",
    "dipy<1.12; python_version < '3.11'",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_tract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs data or minutes (the DiSCo acceptance, the benchmarks)"]
