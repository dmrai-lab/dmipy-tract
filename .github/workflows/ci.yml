name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git"
          pip install torch --index-url https://download.pytorch.org/whl/cpu    # the CPU wheel, before the extra asks for torch
          pip install -e ".[test]"
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m "not slow"
