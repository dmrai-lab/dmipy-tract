name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}
env:
  # dmipy-sim and dmipy-replay are installed from these commits until dmipy-sim 3.x and dmipy-replay 0.2 are on PyPI
  # (then the dependencies are ">=3,<4" and ">=0.2,<0.3" and these go): the head of the replay move's S3b
  # (dmrai-lab/dmipy-sim#873), moved to its merge on main when it merges, and the merge of dmrai-lab/dmipy-replay#20 (R6)
  DMIPY_SIM_COMMIT: 23cfb524a6d79405417eb8dd29f9c756f0e3bb5d
  DMIPY_REPLAY_REF: 85da6252d57b31dd55aaeb1038acea5856630a8d
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay.git@${DMIPY_REPLAY_REF}"
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git@${DMIPY_SIM_COMMIT}"
          pip install torch --index-url https://download.pytorch.org/whl/cpu    # the CPU wheel, so the torch tests run
          pip install -e ".[test]"
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m "not slow"
  slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay.git@${DMIPY_REPLAY_REF}"
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git@${DMIPY_SIM_COMMIT}"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,acceptance]"
      - name: Slow tests
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m slow
