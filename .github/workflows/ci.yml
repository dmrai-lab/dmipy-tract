name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 0'      # weekly: the slow DiSCo acceptance
  workflow_dispatch: {}
env:
  # dmipy-sim is installed from this commit until a 3.x release is on PyPI (then the dependency is ">=3,<4" and this goes)
  DMIPY_SIM_COMMIT: 0908d1e6a834518dfa6254b6e31343d10850a78b
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git@${DMIPY_SIM_COMMIT}"
          pip install torch --index-url https://download.pytorch.org/whl/cpu    # the CPU wheel, so the torch tests run
          pip install -e ".[test]"
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m "not slow"
  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git@${DMIPY_SIM_COMMIT}"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,acceptance]"
      - name: Slow tests
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m slow
