name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install "dmipy-sim @ git+https://github.com/dmrai-lab/dmipy-sim.git"
          pip install -e ".[test]" --no-deps
          pip install pytest scipy "dipy>=1.12" nibabel
          pip install torch --index-url https://download.pytorch.org/whl/cpu    # the torch kernel is checked against the JAX one
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest tests -q -m "not slow"
